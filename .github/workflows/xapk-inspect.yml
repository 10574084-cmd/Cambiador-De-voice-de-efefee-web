name: Inspect XAPK

on:
  workflow_dispatch:
  push:
    paths:
      - "voice-changer-with-effects.xapk"

permissions:
  contents: read

concurrency:
  group: xapk-inspection
  cancel-in-progress: true

jobs:
  inspect:
    name: Build metadata report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Android build tools
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;35.0.0"

      - name: Inspect XAPK and embedded APK metadata
        run: |
          set -euo pipefail
          test -f "voice-changer-with-effects.xapk"
          export AAPT="$ANDROID_HOME/build-tools/35.0.0/aapt"
          test -x "$AAPT"
          python3 .github/scripts/inspect_xapk.py \
            "voice-changer-with-effects.xapk" "xapk-report"

      - name: Upload inspection report
        uses: actions/upload-artifact@v4
        with:
          name: xapk-inspection-report
          path: xapk-report/
          if-no-files-found: error
          retention-days: 14
